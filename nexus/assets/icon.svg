    </filter>
  </defs>
  <g clip-path="url(#body)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#grid)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#halo)"/>
  </g>
  <rect x="104" y="104" width="816" height="816" rx="181" fill="none" stroke="#25467a" stroke-width="8"/>
