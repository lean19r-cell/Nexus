<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10213f"/>
      <stop offset="1" stop-color="#03050b"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="46%">
      <stop offset="0" stop-color="#2e8bff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#2e8bff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="58" height="58" x="100" y="100" patternUnits="userSpaceOnUse">
      <path d="M58 0H0V58" fill="none" stroke="#2e8bff" stroke-opacity="0.14" stroke-width="2"/>
    </pattern>
    <clipPath id="body">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
